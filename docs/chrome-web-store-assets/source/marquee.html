<!doctype html>
<html lang="en">
<meta charset="UTF-8">
<title>StepScript marquee promotional tile</title>
<style>
  @font-face { font-family: Poppins; src: url('/font.woff2'); font-weight: 600; }
  * { box-sizing: border-box; }
  body { width: 1400px; height: 560px; margin: 0; overflow: hidden; color: white; font-family: Poppins, sans-serif; background: #111629; }
  main { height: 100%; padding: 70px 110px; background: radial-gradient(ellipse at 83% 3%, #6531aa88, transparent 57%), linear-gradient(110deg, #111629 28%, #211942); }
  header { display: flex; align-items: center; gap: 26px; }
  img { width: 108px; height: 108px; }
  h1 { margin: 0; font-size: 72px; letter-spacing: -3px; }
  .flow { display: flex; align-items: center; gap: 42px; margin: 62px 0 0 180px; }
  .card { width: 205px; height: 192px; display: grid; place-items: center; border: 2px solid #af7cff88; border-radius: 24px; background: #241d3d; box-shadow: 0 18px 40px #0004; }
  .arrow { width: 65px; height: 4px; position: relative; background: #bfa0f5; }
  .arrow::after { content: ''; position: absolute; right: 0; top: -8px; width: 17px; height: 17px; border-top: 4px solid #bfa0f5; border-right: 4px solid #bfa0f5; transform: rotate(45deg); }
  svg { width: 118px; height: 118px; stroke: #dcc9ff; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .code { color: #dcc9ff; font: 600 74px monospace; letter-spacing: -8px; }
</style>
<main>
  <header><img src="/icon.png" alt=""><h1>StepScript</h1></header>
  <div class="flow" aria-label="Capture interactions, organize steps, generate code">
    <div class="card"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="7" y="8" width="50" height="38" rx="5"/><path d="M7 18h50M14 13h1m5 0h1M27 26l1 25 6-7 8 10 6-5-8-9 10-2z"/></svg></div>
    <span class="arrow"></span>
    <div class="card"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M9 16l4 4 7-8M27 17h28M9 32l4 4 7-8M27 33h28M9 48l4 4 7-8M27 49h28"/></svg></div>
    <span class="arrow"></span>
    <div class="card"><span class="code">&lt;/&gt;</span></div>
  </div>
</main>
</html>
